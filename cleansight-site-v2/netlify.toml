[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: unknown paths serve index.html (the app shows its own 404).
# Same rule is in public/_redirects; this keeps it working if that file is missing.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
